# This CI run builds wheels using the cibuildwheel infrastructure.
# This means it:
# - Uses as old dependencies/infrastructure as possible:
#   - An old manylinux docker container on Linux
#   - An old MACOSX_DEPLOYMENT_TARGET on macOS
#   - An old SYSTEM_VERSION target on Windows
# - Builds OpenMEEG
# - Creates wheels
# - Delocates them
# - Uploads them to PyPi (releases)
# Most of the config lives in `pyproject.toml` and build_tools/cibw_* scripts.

name: cibuildwheel
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release

# https://cibuildwheel.readthedocs.io/en/stable/setup/#github-actions
jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0  # to make before-all work properly
        with:
          python-version: '3.10'
      - uses: hendrikmuhs/ccache-action@v1.2.23
        if: runner.os != 'Linux'
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.arch }}
      # Stays Linux-gated: wheel builds get hdf5 from the h5py manylinux image
      # and build matio from source, so Linux never creates a vcpkg tree here.
      # Caching it would only warn about non-existent paths. (The app workflow
      # does use vcpkg on Linux, and caches it there.)
      - name: Cache vcpkg
        if: runner.os != 'Linux'
        uses: actions/cache@v6.1.0
        with:
          path: |
            vcpkg
            build/vcpkg_installed
          key: ${{ github.job }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg_version.txt', 'build_tools/vcpkg_overlay_ports/**') }}-${{ matrix.os }}-${{ matrix.arch }}-0
      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: ./wrapping/python
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  test_wheels:
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.13 exercises the abi3 wheel on an interpreter it was not built for;
        # 3.14t exercises the separate free-threaded wheel.
        python-version: ['3.13', '3.14t']
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: wheels-${{ matrix.os }}-${{ matrix.arch }}
      - name: Get data
        shell: bash
        run: |
          set -eo pipefail
          git clone --no-checkout https://github.com/openmeeg/openmeeg.git omg
          cd omg
          git sparse-checkout init --cone
          git sparse-checkout set data
          git checkout
          OPENMEEG_DATA_PATH=$(pwd)/data
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            OPENMEEG_DATA_PATH=$(cygpath -w "$OPENMEEG_DATA_PATH")
          fi
          echo "OPENMEEG_DATA_PATH=$OPENMEEG_DATA_PATH" | tee -a $GITHUB_ENV
      - run: ls -alt dist/
        shell: bash
      # numpy is openmeeg's only runtime dep; installing it here lets the next
      # step stay --no-index so it can never silently pull openmeeg from PyPI.
      - run: pip install -v pytest numpy
        shell: bash
      # Let pip pick the wheel matching this interpreter: dist/ holds both the
      # abi3 wheel and the free-threaded one, and only one is installable here.
      - run: pip install -v --no-index --no-deps --find-links dist openmeeg
        shell: bash
      - name: Check the GIL stays disabled on free-threaded builds
        if: endsWith(matrix.python-version, 't')
        run: python -c "import sys, openmeeg; assert not sys._is_gil_enabled()"
      # Only exercise the om_viz plotting path on one runner, it is heavy
      - name: Install viz dependencies
        if: startsWith(matrix.os, 'ubuntu') && matrix.python-version == '3.13'
        run: pip install pyvista pyvistaqt PyQt6
      - uses: pyvista/setup-headless-display-action@v5
        if: startsWith(matrix.os, 'ubuntu') && matrix.python-version == '3.13'
        with:
          qt: true
      - run: pytest -m "not slow" --pyargs openmeeg
      - run: om_viz --help

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, test_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write  # for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/mne
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # upload to PyPI on every tag (we assume these are releases!)
      - uses: pypa/gh-action-pypi-publish@release/v1
