# This CI run builds wheels using the cibuildwheel infrastructure.
# This means it:
# - Uses as old dependencies/infrastructure as possible:
#   - An old manylinux docker container on Linux
#   - An old MACOSX_DEPLOYMENT_TARGET on macOS
#   - An old SYSTEM_VERSION target on Windows
# - Builds OpenMEEG
# - Creates wheels
# - Delocates them
# - Uploads them to PyPi (releases)
# The same OpenMEEG build also produces the C++ app installers, which get
# tested on clean runners and attached to a draft GitHub release.
# Most of the config lives in `pyproject.toml` and build_tools/cibw_* scripts.

name: cibuildwheel
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release

# https://cibuildwheel.readthedocs.io/en/stable/setup/#github-actions
jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0  # to make before-all work properly
        with:
          python-version: '3.10'
      - uses: hendrikmuhs/ccache-action@v1.2.24
        if: runner.os == 'macOS'  # Linux builds in a container, Windows with the VS generator
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.arch }}
          save: ${{ github.event_name == 'push' }}
      # Packages built by vcpkg (see VCPKG_DEFAULT_BINARY_CACHE in
      # setup_vcpkg_compilation.sh). Not on Linux: wheel builds there get hdf5
      # from the h5py manylinux image and build matio from source, no vcpkg.
      - name: Cache vcpkg
        if: runner.os != 'Linux'
        uses: actions/cache@v6.1.0
        with:
          path: |
            vcpkg
            ${{ runner.temp }}/ci-cache/vcpkg
          key: ${{ github.job }}-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkg_version.txt', 'build_tools/vcpkg_overlay_ports/**', 'build_tools/vcpkg_triplets/**') }}-${{ matrix.os }}-${{ matrix.arch }}-1
      # On Linux, ccache runs inside the cibuildwheel container (which sees the
      # runner's filesystem), so the ccache action above cannot set it up
      - name: Restore ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.os }}-${{ matrix.arch }}-
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: ./wrapping/python
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CI_CACHE_DIR: ${{ runner.temp }}/ci-cache
      - name: Save ccache (Linux)
        if: runner.os == 'Linux' && github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
      # Linux writes them to the output-dir (see cibw_before_all.sh), the others
      # to the checkout. A single path, so the tarball is at the artifact's root.
      - uses: actions/upload-artifact@v7
        with:
          name: OpenMEEG-installers-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.os == 'Linux' && './wheelhouse' || './installers' }}/OpenMEEG-*.tar.gz
          if-no-files-found: error

  test_wheels:
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.13 exercises the abi3 wheel on an interpreter it was not built for;
        # 3.14t and 3.15t exercise the separate free-threaded wheels.
        python-version: ['3.13', '3.14t', '3.15t']
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: wheels-${{ matrix.os }}-${{ matrix.arch }}
      - name: Get data
        shell: bash
        run: |
          set -eo pipefail
          git clone --no-checkout https://github.com/openmeeg/openmeeg.git omg
          cd omg
          git sparse-checkout init --cone
          git sparse-checkout set data
          git checkout
          OPENMEEG_DATA_PATH=$(pwd)/data
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            OPENMEEG_DATA_PATH=$(cygpath -w "$OPENMEEG_DATA_PATH")
          fi
          echo "OPENMEEG_DATA_PATH=$OPENMEEG_DATA_PATH" | tee -a $GITHUB_ENV
      - run: ls -alt dist/
        shell: bash
      # numpy is openmeeg's only runtime dep; installing it here lets the next
      # step stay --no-index so it can never silently pull openmeeg from PyPI.
      - run: pip install -v pytest numpy
        shell: bash
      # Let pip pick the wheel matching this interpreter: dist/ holds both the
      # abi3 wheel and the free-threaded one, and only one is installable here.
      - run: pip install -v --no-index --no-deps --find-links dist openmeeg
        shell: bash
      - name: Check the GIL stays disabled on free-threaded builds
        if: endsWith(matrix.python-version, 't')
        run: python -c "import sys, openmeeg; assert not sys._is_gil_enabled()"
      # Only exercise the om_viz plotting path on one runner, it is heavy
      - name: Install viz dependencies
        if: startsWith(matrix.os, 'ubuntu') && matrix.python-version == '3.13'
        run: pip install pyvista pyvistaqt PyQt6
      - uses: pyvista/setup-headless-display-action@v5
        if: startsWith(matrix.os, 'ubuntu') && matrix.python-version == '3.13'
        with:
          qt: true
      - run: pytest -m "not slow" --pyargs openmeeg
      - run: om_viz --help

  # The installers have no auditwheel/delocate/delvewheel safety net, so check
  # they are self-contained where none of the build dependencies are around
  test_apps:
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: build_tools
      - uses: actions/download-artifact@v8
        with:
          path: dist
          name: OpenMEEG-installers-${{ matrix.os }}-${{ matrix.arch }}
      # On Linux, a bare container (glibc >= the manylinux_2_28 build's) rather
      # than the runner, which has things like libgomp installed
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/work" -w /work ubuntu:22.04 bash build_tools/cibw_test_apps.sh dist/OpenMEEG-*.tar.gz
      - name: Test
        if: runner.os != 'Linux'
        run: bash build_tools/cibw_test_apps.sh dist/OpenMEEG-*.tar.gz

  # On pushes to main, refresh the "dev" draft release with the installers; on
  # publishing a release, attach them to it (leaving it published, since
  # changing it would trigger this workflow again)
  release:
    needs: [build_wheels, test_apps]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: OpenMEEG-installers-*
          merge-multiple: true
      - name: Development release notes
        if: github.event_name == 'push'
        run: |
          set -e
          echo "# Development release" >> body.md
          echo "" >> body.md
          echo "This is an unreleased draft version (only visible to maintainers)." >> body.md
          echo "" >> body.md
          echo "- Created: $(date +'%Y-%m-%dT%H:%M:%S%z')" >> body.md
          echo "- Commit: \`${{ github.sha }}\`" >> body.md
          cat body.md
      - name: Check files
        run: ls -alR .
      # https://github.com/softprops/action-gh-release
      - uses: softprops/action-gh-release@v3.0.3
        if: github.event_name == 'push'
        with:
          draft: true
          body_path: body.md
          tag_name: dev
          files: OpenMEEG-*
      - uses: softprops/action-gh-release@v3.0.3
        if: github.event_name == 'release'
        with:
          files: OpenMEEG-*

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, test_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write  # for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/openmeeg
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*  # not the app installers
          merge-multiple: true
      # upload to PyPI on every tag (we assume these are releases!)
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Asks the conda-forge bot to open the version-bump PR on the feedstock right
  # away rather than waiting for its next scheduled scan
  conda-forge:
    needs: upload_pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.CONDA_FORGE_ISSUE_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - run: |
          gh issue create --repo conda-forge/openmeeg-feedstock \
            --title "@conda-forge-admin, please update version" \
            --body "openmeeg/openmeeg ${TAG} has been released and uploaded to PyPI."
